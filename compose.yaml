name: wp-stack
services:
  db:
    image: mysql:8.0.23
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+09:00
    volumes:
      - db_data:/var/lib/mysql
    networks: [back]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-u', 'root', '-prootpwd']
      interval: 10s
      timeout: 5s
      retries: 12

  wordpress:
    # PHP 8 では get_magic_quotes_gpc が廃止され古いWPが落ちるため、互換性のあるPHP7.4系を使用
    image: wordpress:php7.4-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wp
    volumes:
      - ./wordpress:/var/www/html
    networks: [back]

  # Lightweight SMTP testing server with Web UI
  # UI: http://localhost:8025  SMTP: localhost:1025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks: [front, back]

  # WP-CLI helper to run WordPress commands (no daemon)
  wp-cli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      WORDPRESS_DB_NAME: wp
    user: "33:33" # www-data to avoid permission issues on mounted volume
    volumes:
      - ./wordpress:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["bash","-lc"]
    command: ["wp --info && echo 'Use: docker compose run --rm wp-cli wp <command>'"]
    networks: [back]

  nginx:
    image: nginx:latest
    depends_on: [wordpress]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [front, back]

volumes:
  db_data:

networks:
  front:
  back:
