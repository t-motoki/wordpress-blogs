resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

upstream wordpress_backend {
    zone wordpress_backend 64k;   # ← 共有メモリゾーンを定義（必須）
    least_conn;
    server wordpress:80 resolve;  # ← DockerのDNSで複数Aレコードを動的に解決
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;

    location / {
        # Forward to WordPress upstream
        proxy_pass http://wordpress_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;

        # Preserve original client protocol if a CDN/ALB terminated TLS and sent X-Forwarded-Proto
        # Fallback to this Nginx connection scheme when the header is absent
        set $client_proto $scheme;
        if ($http_x_forwarded_proto != "") {
            set $client_proto $http_x_forwarded_proto;
        }
        # For known public hosts behind HTTPS (Funnel/CDN), force https to avoid mixed content
        if ($host ~* "\.ts\.net$") { set $client_proto https; }
        if ($host = www.tmotoki.net) { set $client_proto https; }
        proxy_set_header X-Forwarded-Proto $client_proto;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
